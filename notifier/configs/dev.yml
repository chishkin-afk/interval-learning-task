app:
  name: intask-notifier
  version: 0.0.1
  env: ${APP_ENV}

server:
  http:
    addr: ${HTTP_ADDR}
    tls:
      enable: false
      server_cert_path: ./certs/server.crt
      server_key_path: ./certs/server.key
  conns:
    read_timeout: 2s
    write_timeout: 2s
    idle_timeout: 30s

backend:
  addr: ${BACKEND_URL}
  timeout: 2s

telegram:
  token: ${TELEGRAM_TOKEN}
  poll:
    timeout: 10s